<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030303" />
  <title>FORGEMULE</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #030303;
      font-family: Georgia, "Times New Roman", serif;
      color: #e8e1d4;
      -webkit-font-smoothing: antialiased;
    }
    .top-left {
      position: absolute;
      top: 28px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stealth-mark {
      display: block;
      width: 34px;
      height: 32px;
      object-fit: contain;
      flex: none;
    }
    .top-left p {
      margin: 0;
      font-size: clamp(0.78rem, 1vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      line-height: 1.8;
      text-transform: lowercase;
      color: #e8e1d4;
      text-decoration: none;
    }
    .footer {
      position: absolute;
      bottom: 24px;
      left: 32px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: #8f8678;
    }
  </style>
</head>
<body>
  <div class="top-left">
    <img class="stealth-mark" src="./favicon.svg" alt="" aria-hidden="true" width="34" height="32" />
    <p>stealth mode</p>
  </div>
  <div class="footer">© 2026 All Rights Reserved FORGEMULE</div>
</body>
</html>
